AWSTemplateFormatVersion: "2010-09-09"
Description: >-
  Software delivery pipeline: GitHub (source) -> CodeBuild (build/test) ->
  Manual review (SNS email, pipeline pauses until approved) -> S3 deploy.

Parameters:
  GitHubRepo:
    Type: String
    Description: GitHub repository in owner/name form (e.g. ezanaasfaw/pipeline-hw).
    AllowedPattern: "^[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+$"
    ConstraintDescription: Must look like owner/repository.
  GitHubBranch:
    Type: String
    Default: main
    Description: Branch the pipeline watches.
  ConnectionArn:
    Type: String
    Description: ARN of an AVAILABLE GitHub connection (Developer Tools > Settings > Connections).
    AllowedPattern: "^arn:aws:(codestar-connections|codeconnections):.+"
    ConstraintDescription: Must be a CodeConnections / CodeStar connection ARN.
  ApprovalEmail:
    Type: String
    Description: Maintainer email that is notified when a review is needed.
    AllowedPattern: "^[^@\\s]+@[^@\\s]+\\.[^@\\s]+$"
    ConstraintDescription: Must be a valid email address.

Resources:
  # ---------- Storage ----------
  ArtifactBucket:
    Type: AWS::S3::Bucket
    Properties:
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      Tags:
        - Key: Name
          Value: PipelineArtifacts

  DeployBucket:
    Type: AWS::S3::Bucket
    Properties:
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      Tags:
        - Key: Name
          Value: PipelineDeployTarget

  # ---------- Notification for the manual review ----------
  ApprovalTopic:
    Type: AWS::SNS::Topic
    Properties:
      DisplayName: Pipeline review needed
      Subscription:
        - Protocol: email
          Endpoint: !Ref ApprovalEmail

  # ---------- CodeBuild ----------
  CodeBuildRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: codebuild.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: CodeBuildAccess
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - logs:CreateLogGroup
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource: "*"
              - Effect: Allow
                Action:
                  - s3:GetObject
                  - s3:GetObjectVersion
                  - s3:PutObject
                Resource: !Sub "${ArtifactBucket.Arn}/*"

  BuildProject:
    Type: AWS::CodeBuild::Project
    Properties:
      Name: !Sub "${AWS::StackName}-build"
      ServiceRole: !GetAtt CodeBuildRole.Arn
      Source:
        Type: CODEPIPELINE
        BuildSpec: buildspec.yml
      Artifacts:
        Type: CODEPIPELINE
      Environment:
        Type: LINUX_CONTAINER
        ComputeType: BUILD_GENERAL1_SMALL
        Image: aws/codebuild/standard:7.0

  # ---------- CodePipeline ----------
  PipelineRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: codepipeline.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: PipelineAccess
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - s3:GetObject
                  - s3:GetObjectVersion
                  - s3:GetBucketVersioning
                  - s3:GetBucketLocation
                  - s3:ListBucket
                  - s3:PutObject
                Resource:
                  - !GetAtt ArtifactBucket.Arn
                  - !Sub "${ArtifactBucket.Arn}/*"
                  - !GetAtt DeployBucket.Arn
                  - !Sub "${DeployBucket.Arn}/*"
              - Effect: Allow
                Action:
                  - codebuild:StartBuild
                  - codebuild:BatchGetBuilds
                Resource: !GetAtt BuildProject.Arn
              - Effect: Allow
                Action:
                  - codestar-connections:UseConnection
                  - codeconnections:UseConnection
                Resource: !Ref ConnectionArn
              - Effect: Allow
                Action: sns:Publish
                Resource: !Ref ApprovalTopic

  Pipeline:
    Type: AWS::CodePipeline::Pipeline
    Properties:
      Name: !Sub "${AWS::StackName}-pipeline"
      PipelineType: V1
      RoleArn: !GetAtt PipelineRole.Arn
      ArtifactStore:
        Type: S3
        Location: !Ref ArtifactBucket
      Stages:
        - Name: Source
          Actions:
            - Name: GitHubSource
              ActionTypeId:
                Category: Source
                Owner: AWS
                Provider: CodeStarSourceConnection
                Version: "1"
              Configuration:
                ConnectionArn: !Ref ConnectionArn
                FullRepositoryId: !Ref GitHubRepo
                BranchName: !Ref GitHubBranch
                OutputArtifactFormat: CODE_ZIP
                DetectChanges: "true"
              OutputArtifacts:
                - Name: SourceOutput
        - Name: Build
          Actions:
            - Name: BuildAndTest
              ActionTypeId:
                Category: Build
                Owner: AWS
                Provider: CodeBuild
                Version: "1"
              Configuration:
                ProjectName: !Ref BuildProject
              InputArtifacts:
                - Name: SourceOutput
              OutputArtifacts:
                - Name: BuildOutput
        - Name: ManualReview
          Actions:
            - Name: MaintainerApproval
              ActionTypeId:
                Category: Approval
                Owner: AWS
                Provider: Manual
                Version: "1"
              Configuration:
                NotificationArn: !Ref ApprovalTopic
                CustomData: "A new change passed the build. Please review the commit on GitHub, then approve or reject this stage."
                ExternalEntityLink: !Sub "https://github.com/${GitHubRepo}/commits/${GitHubBranch}"
        - Name: Deploy
          Actions:
            - Name: DeployToS3
              ActionTypeId:
                Category: Deploy
                Owner: AWS
                Provider: S3
                Version: "1"
              Configuration:
                BucketName: !Ref DeployBucket
                Extract: "true"
              InputArtifacts:
                - Name: BuildOutput

Outputs:
  PipelineName:
    Description: Name of the pipeline
    Value: !Ref Pipeline
  PipelineUrl:
    Description: Console link to the pipeline
    Value: !Sub "https://${AWS::Region}.console.aws.amazon.com/codesuite/codepipeline/pipelines/${Pipeline}/view?region=${AWS::Region}"
  DeployBucketName:
    Description: Bucket that receives the approved build
    Value: !Ref DeployBucket
  ArtifactBucketName:
    Description: Bucket used by CodePipeline for artifacts (empty it before deleting the stack)
    Value: !Ref ArtifactBucket
  ApprovalTopicArn:
    Description: SNS topic that notifies the maintainer
    Value: !Ref ApprovalTopic
